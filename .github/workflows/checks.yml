name: Verify local app
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pytest -q
      - run: ruff check --select F,E9 backend scripts tests evaluation
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm test -- src/Replay.test.tsx
        working-directory: frontend
        env:
          VITE_REPLAY: '1'
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=moderate
        working-directory: frontend
      # Real model evaluation is an explicit local procedure with pinned weights.
      # These checks never pretend a mocked API call establishes model accuracy.
